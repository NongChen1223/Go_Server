basePath: /
definitions:
  common.PageResponse:
    properties:
      current:
        description: 当前页码
        type: integer
      pages:
        description: 总页数
        type: integer
      records:
        description: 数据列表
      size:
        description: 每页条数
        type: integer
      total:
        description: 总条数
        type: integer
    type: object
  common.Response:
    properties:
      code:
        description: 代码
        example: 200
        type: integer
      data:
        description: 数据集
      msg:
        description: 消息
        type: string
    type: object
  dto.AdminLoginReq:
    properties:
      admin_name:
        description: 管理员账号
        example: admin
        type: string
      password:
        description: 密码
        example: "123456"
        type: string
    required:
    - admin_name
    - password
    type: object
  dto.AdminRegisterReq:
    properties:
      admin_name:
        description: 管理员账号
        example: admin
        maxLength: 30
        minLength: 3
        type: string
      department:
        description: 部门
        example: 技术部
        maxLength: 50
        type: string
      email:
        description: 邮箱
        example: admin@example.com
        type: string
      password:
        description: 密码
        example: "123456"
        maxLength: 20
        minLength: 6
        type: string
      phone_number:
        description: 手机号
        example: "13800138000"
        type: string
      position:
        description: 职位
        example: 系统管理员
        maxLength: 50
        type: string
      real_name:
        description: 真实姓名
        example: 张三
        maxLength: 30
        minLength: 2
        type: string
      remark:
        description: 备注
        example: 系统管理员账号
        maxLength: 500
        type: string
    required:
    - admin_name
    - email
    - password
    - real_name
    type: object
  dto.DictTypeReq:
    properties:
      dict_id:
        description: 字典类型ID，更新时需要，创建时忽略
        type: integer
      dict_name:
        description: 字典名称，必填
        type: string
      dict_type:
        description: 字典类型标识，必填，如"game_type"
        type: string
      remark:
        description: 备注
        type: string
      status:
        description: 状态（0停用 1正常）
        type: integer
    required:
    - dict_name
    - dict_type
    type: object
  dto.DictTypeRes:
    properties:
      create_by:
        description: 创建者
        type: string
      create_time:
        description: 创建时间
        type: string
      dict_id:
        description: 字典类型ID
        type: integer
      dict_name:
        description: 字典名称
        type: string
      dict_type:
        description: 字典类型标识
        type: string
      remark:
        description: 备注
        type: string
      status:
        description: 状态（0停用 1正常）
        type: integer
      update_by:
        description: 更新者
        type: string
      update_time:
        description: 更新时间
        type: string
    type: object
  dto.LoginReq:
    properties:
      password:
        description: 密码，必填
        type: string
      user_name:
        description: 用户名，必填
        type: string
    required:
    - password
    - user_name
    type: object
  dto.PublisherReq:
    properties:
      description:
        description: 厂商介绍，可选
        type: string
      founded_date:
        description: 成立日期，可选
        type: string
      logo_url:
        description: 厂商LOGO，可选
        type: string
      publisher_id:
        description: 厂商ID，更新时需要，创建时忽略
        type: integer
      publisher_name:
        description: 厂商名称，必填
        type: string
      status:
        description: 状态，必填，只能是0或1
        enum:
        - 0
        - 1
        type: integer
      website:
        description: 官方网站，可选
        type: string
    required:
    - publisher_name
    - status
    type: object
  dto.PublisherRes:
    properties:
      create_by:
        description: 创建者
        type: string
      create_time:
        description: 创建时间
        type: string
      description:
        description: 厂商介绍
        type: string
      founded_date:
        description: 成立日期
        type: string
      logo_url:
        description: 厂商LOGO
        type: string
      publisher_id:
        description: 厂商ID
        type: integer
      publisher_name:
        description: 厂商名称
        type: string
      status:
        description: 状态
        type: integer
      update_by:
        description: 更新者
        type: string
      update_time:
        description: 更新时间
        type: string
      website:
        description: 官方网站
        type: string
    type: object
  dto.RegisterUserReq:
    properties:
      email:
        type: string
      password:
        type: string
      user_name:
        type: string
    required:
    - email
    - password
    - user_name
    type: object
  dto.UserInfoRes:
    properties:
      avatar:
        type: string
      create_time:
        type: string
      email:
        type: string
      login_date:
        type: string
      login_ip:
        type: string
      nick_name:
        type: string
      phone_number:
        type: string
      sex:
        type: integer
      user_id:
        type: integer
      user_name:
        type: string
      user_type:
        type: string
    type: object
host: localhost:8801
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: 这是一个游戏管理系统的API文档，包含前端用户、后台管理、游戏管理等功能
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: 游戏管理系统 API
  version: "1.0"
paths:
  /v1/admin/dict/data/{type}:
    get:
      consumes:
      - application/json
      description: 根据字典类型标识获取该类型下的所有字典数据
      parameters:
      - description: 字典类型标识
        in: path
        name: type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  items: {}
                  type: array
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 根据类型获取字典数据
      tags:
      - '[Admin]字典管理'
  /v1/admin/dict/types:
    get:
      consumes:
      - application/json
      description: 分页获取字典类型列表，支持按名称和类型筛选
      parameters:
      - description: 字典名称（模糊查询）
        in: query
        name: dict_name
        type: string
      - description: 字典类型（模糊查询）
        in: query
        name: dict_type
        type: string
      - description: 状态（0停用 1正常）
        in: query
        name: status
        type: integer
      - default: 1
        description: 页码
        in: query
        name: page_num
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/common.PageResponse'
            - properties:
                records:
                  items:
                    $ref: '#/definitions/dto.DictTypeRes'
                  type: array
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 获取字典类型列表
      tags:
      - '[Admin]字典管理'
    post:
      consumes:
      - application/json
      description: 创建新的字典类型，用于系统配置管理
      parameters:
      - description: 字典类型信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DictTypeReq'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 创建字典类型
      tags:
      - '[Admin]字典管理'
  /v1/admin/dict/types/{id}:
    delete:
      consumes:
      - application/json
      description: 根据ID删除字典类型
      parameters:
      - description: 字典类型ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: 字典类型不存在
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 删除字典类型
      tags:
      - '[Admin]字典管理'
    get:
      consumes:
      - application/json
      description: 根据ID获取字典类型的详细信息
      parameters:
      - description: 字典类型ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.DictTypeRes'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: 字典类型不存在
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 获取字典类型详情
      tags:
      - '[Admin]字典管理'
    put:
      consumes:
      - application/json
      description: 根据ID更新字典类型信息
      parameters:
      - description: 字典类型ID
        in: path
        name: id
        required: true
        type: integer
      - description: 字典类型信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DictTypeReq'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: 字典类型不存在
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 更新字典类型
      tags:
      - '[Admin]字典管理'
  /v1/admin/login:
    post:
      consumes:
      - application/json
      description: 管理员使用账号密码登录系统，返回JWT token
      parameters:
      - description: 登录请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AdminLoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 认证失败
          schema:
            $ref: '#/definitions/common.Response'
      summary: 管理员登录
      tags:
      - 管理员认证
  /v1/admin/logout:
    post:
      consumes:
      - application/json
      description: 管理员登出系统，清除token
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 管理员登出
      tags:
      - 管理员认证
  /v1/admin/publishers:
    get:
      consumes:
      - application/json
      description: 分页获取游戏厂商列表，支持按名称筛选
      parameters:
      - description: 厂商名称（模糊查询）
        in: query
        name: publisher_name
        type: string
      - description: 状态（0停用 1正常）
        in: query
        name: status
        type: integer
      - default: 1
        description: 页码
        in: query
        name: page_num
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/common.PageResponse'
            - properties:
                records:
                  items:
                    $ref: '#/definitions/dto.PublisherRes'
                  type: array
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 获取游戏厂商列表
      tags:
      - '[Admin]厂商管理'
    post:
      consumes:
      - application/json
      description: 创建新的游戏厂商信息
      parameters:
      - description: 厂商信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.PublisherReq'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 创建游戏厂商
      tags:
      - '[Admin]厂商管理'
  /v1/admin/publishers/{id}:
    delete:
      consumes:
      - application/json
      description: 根据ID删除游戏厂商
      parameters:
      - description: 厂商ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: 厂商不存在
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 删除游戏厂商
      tags:
      - '[Admin]厂商管理'
    get:
      consumes:
      - application/json
      description: 根据ID获取游戏厂商的详细信息
      parameters:
      - description: 厂商ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.PublisherRes'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: 厂商不存在
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 获取游戏厂商详情
      tags:
      - '[Admin]厂商管理'
    put:
      consumes:
      - application/json
      description: 根据ID更新游戏厂商信息
      parameters:
      - description: 厂商ID
        in: path
        name: id
        required: true
        type: integer
      - description: 厂商信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.PublisherReq'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: 厂商不存在
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 更新游戏厂商
      tags:
      - '[Admin]厂商管理'
  /v1/admin/register:
    post:
      consumes:
      - application/json
      description: 创建新的管理员账号（需要管理员权限）
      parameters:
      - description: 注册请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AdminRegisterReq'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 创建管理员账号
      tags:
      - 管理员认证
  /v1/api/auth/login:
    post:
      consumes:
      - application/json
      description: 前台用户使用账号密码登录系统
      parameters:
      - description: 登录请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功，返回token
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 认证失败
          schema:
            $ref: '#/definitions/common.Response'
      summary: 用户登录
      tags:
      - '[API]用户认证'
  /v1/api/auth/register:
    post:
      consumes:
      - application/json
      description: 前台用户注册新账号
      parameters:
      - description: 注册请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterUserReq'
      produces:
      - application/json
      responses:
        "200":
          description: 注册成功，返回token
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/common.Response'
      summary: 用户注册
      tags:
      - '[API]用户认证'
  /v1/api/user/info:
    get:
      consumes:
      - application/json
      description: 获取当前登录用户的详细信息
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserInfoRes'
              type: object
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 获取用户信息
      tags:
      - '[API]用户管理'
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
